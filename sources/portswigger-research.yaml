id: portswigger-research
kind: rss
url: https://portswigger.net/research/rss
adapter: rss_v1
item_kind: news
category: threat_research
organization: 'PortSwigger Research'
interval_minutes: 15
max_requests_per_hour: 4
max_concurrency: 1
enabled: true
policy:
