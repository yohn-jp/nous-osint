name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.scope.outputs.python }}
      frontend: ${{ steps.scope.outputs.frontend }}
      backend_image: ${{ steps.scope.outputs.backend_image }}
      reports: ${{ steps.scope.outputs.reports }}
      report_image: ${{ steps.scope.outputs.report_image }}
      terraform: ${{ steps.scope.outputs.terraform }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify complete push or PR diff
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/changes.py

  ci-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release scope decisions and Git history edge cases
        run: python -m unittest discover -s tests/ci -v

  check:
    needs: [changes, ci-contracts]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nous
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nous"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/nous
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: reports/site/package-lock.json
      - parallel:
          - name: Install Python test dependencies
            run: python -m pip install -e '.[dev]'
          - name: Install Astro dependencies used by report pipeline fixture tests
            working-directory: reports/site
            run: npm ci --no-audit --no-fund
      # Independent checks share a runner and execute via GitHub Actions' native
      # parallel steps. The database migration completes before the dependent
      # snapshot/pytest steps below.
      - parallel:
          - name: Lint and validate source registry
            run: |
              ruff check src migrations tests
              python -m nous.onboard_source --check-registry
          - name: Migrate CI database
            run: alembic upgrade head
          - name: Validate source compilation and shell syntax
            run: |
              python -m compileall -q src migrations
              bash -n scripts/backup-pull.sh scripts/snapshot-dump.sh scripts/restore-test.sh scripts/deploy-image.sh
      - name: Verify consistent database snapshot dump
        run: |
          db=$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}' | head -1)
          test -n "$db"
          docker exec "$db" psql -U postgres -d nous -v ON_ERROR_STOP=1 -c "CREATE ROLE nous LOGIN"
          docker exec "$db" psql -U postgres -d nous -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO nous; GRANT SELECT ON ALL TABLES IN SCHEMA public TO nous; GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO nous"
          docker exec "$db" psql -U postgres -d nous -v ON_ERROR_STOP=1 -c "GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO nous"
          if ! timeout 30s docker exec -i "$db" env NOUS_SNAPSHOT_DATABASE_ONLY=1 bash -s < scripts/snapshot-dump.sh > /tmp/nous-ci.dump 2> /tmp/nous-ci.meta; then
            cat /tmp/nous-ci.meta >&2
            exit 1
          fi
          grep -Fq 'NOUS_SNAPSHOT_METADATA=0011|0|0|0|0|0|0|0|none' /tmp/nous-ci.meta
          docker exec -i "$db" pg_restore -l < /tmp/nous-ci.dump | grep -q sources
      - run: pytest -q


  cve-role-grants:
    needs: [changes, ci-contracts]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nous
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nous"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/nous
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Prepare disposable database at revision 0008
        run: alembic upgrade 0008
      - name: Verify 0009/0010 grants through canonical non-superuser roles
        run: python scripts/test-cve-role-grants.py


  frontend:
    outputs:
      release_mode: ${{ steps.release-build.outputs.mode }}
    needs: [changes, ci-contracts]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            edge/frontend/package-lock.json
      # UI and Edge install into separate node_modules directories.
      - parallel:
          - name: Install UI dependencies
            run: npm ci --no-audit --no-fund
          - name: Install pinned Edge tools
            working-directory: edge/frontend
            run: npm ci --no-audit --no-fund
      # Typechecks are read-only; the Quasar build writes only ui/dist.
      # Edge bundling starts after the real SPA assets exist.
      - parallel:
          - name: Typecheck Quasar UI
            run: npm run typecheck
          - name: Build static Quasar SPA
            run: npm run build
          - name: Typecheck Edge Worker
            working-directory: edge/frontend
            run: npm run typecheck
      - name: Verify static output
        run: test -f dist/spa/index.html
      - name: Build Edge Worker (no upload)
        working-directory: edge/frontend
        run: npm run build
      - name: Test routing and emulated origin contracts
        working-directory: edge/frontend
        run: npm test
      - name: Validate script-only version upload offline
        working-directory: edge/frontend
        run: npx cf workers versions create --dry-run --prebuilt --mode production

      - name: Build release mode and record SHA provenance
        id: release-build
        if: github.event_name == 'push'
        working-directory: edge/frontend
        run: |
          npx cf build --mode production
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; writeFileSync('.cloudflare/output/v0/provenance.json', JSON.stringify({sha: process.env.GITHUB_SHA, mode: 'production'}))"
          echo "mode=production" >> "$GITHUB_OUTPUT"
      - name: Transfer main release build to the protected deploy job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: edge-release-${{ github.sha }}
          path: edge/frontend/.cloudflare/output/v0/
          include-hidden-files: true
          retention-days: 7


  reports:
    needs: [changes, ci-contracts]
    if: needs.changes.outputs.reports == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: reports/site/package-lock.json
      - parallel:
          - name: Install JSON Schema validator
            run: python -m pip install jsonschema==4.25.1
          - name: Install pinned Astro dependencies
            working-directory: reports/site
            run: npm ci --no-audit --no-fund
      - name: Validate report JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for path in sorted(Path('reports/schemas').glob('*.schema.json')):
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding='utf-8')))
          PY
      - name: Build report site
        working-directory: reports/site
        run: npm run build
      - name: Check report site output and local links
        run: |
          test -f reports/site/dist/index.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('reports/site/dist')
          pages = sorted(root.rglob('*.html'))
          assert pages, 'Astro emitted no HTML pages'

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = []
              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name in {'href', 'src'} and value:
                          self.values.append(value)

          for page in pages:
              parser = Links()
              parser.feed(page.read_text(encoding='utf-8'))
              for value in parser.values:
                  parsed = urlsplit(value)
                  if parsed.scheme or parsed.netloc or value.startswith('#'):
                      continue
                  path = parsed.path
                  if not path:
                      continue
                  if path.startswith('/reports/'):
                      target = root / path.removeprefix('/reports/')
                  elif path.startswith('/'):
                      continue
                  else:
                      target = page.parent / path
                  if target.is_dir():
                      target = target / 'index.html'
                  assert target.resolve().is_relative_to(root.resolve()), f'link escapes site: {value}'
                  assert target.is_file(), f'broken local link in {page}: {value}'
          PY


  image:
    needs: [changes, check, frontend, reports]
    if: >-
      always() && needs.changes.outputs.backend_image == 'true' &&
      needs.check.result == 'success' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.reports.result == 'success' || needs.reports.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR on main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and publish only from main
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/yohn-jp/nous-osint:main
          cache-from: type=gha,scope=nous-app
          cache-to: type=gha,mode=max,scope=nous-app
      - name: Record immutable image reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          echo "ghcr.io/yohn-jp/nous-osint@$IMAGE_DIGEST" | tee image-ref.txt
          echo "Image: ghcr.io/yohn-jp/nous-osint@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload deployment reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nous-image-digest
          path: image-ref.txt
          retention-days: 90


  report-worker-image:
    needs: [changes, check, reports]
    if: >-
      always() && needs.changes.outputs.report_image == 'true' &&
      needs.check.result == 'success' && needs.reports.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR on main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build report Worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.reports
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/yohn-jp/nous-osint-reports:main
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha,scope=nous-report-worker
          cache-to: type=gha,mode=max,scope=nous-report-worker
      - name: Exercise production image under read-only rootfs and 128 MiB tmpfs
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --tmpfs /var/lib/nous-reports/private:rw,nosuid,nodev,size=512m \
            --entrypoint python ghcr.io/yohn-jp/nous-osint-reports:main -c '
          import json
          from pathlib import Path
          from nous.report_pipeline import _SCHEMA_DIR, _SITE_DIR, build_static_release
          from nous.report_templates import resolve_template
          assert (_SCHEMA_DIR / "article-v1.schema.json").is_file()
          assert (_SITE_DIR / "node_modules" / "astro").is_dir()
          assert resolve_template("security-daily")["id"] == "security-daily"
          assert resolve_template("cve-kev-deep-dive")["id"] == "cve-kev-deep-dive"
          root = Path("/var/lib/nous-reports/private/build-smoke")
          dist, assets, digest = build_static_release([], root)
          assert (dist / "index.html").is_file()
          assert len(digest) == 64
          fixture = json.loads((_SITE_DIR / "test-fixtures" / "cve-fact.json").read_text())
          article_dist, article_assets, article_digest = build_static_release([fixture], root)
          assert (article_dist / "index.html").is_file()
          assert (article_dist / "cve" / fixture["slug"] / "index.html").is_file()
          assert len(article_digest) == 64
          assert not list(root.glob("cache-*"))
          import os, subprocess
          from nous.report_pipeline import CodexRunner
          codex_home = Path("/var/lib/nous-reports/private/codex-home-smoke")
          codex_home.mkdir()
          env = {"PATH": os.environ["PATH"], "HOME": str(codex_home),
                 "CODEX_HOME": str(codex_home), "TMPDIR": "/tmp",
                 "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8"}
          version = subprocess.run(["codex", "--version"], env=env, check=True,
                                   capture_output=True, text=True)
          assert version.stdout.strip() == "codex-cli 0.166.0"
          arg0_root = codex_home / "tmp" / "arg0-linux"
          launchers = list(arg0_root.glob("codex-arg0*"))
          assert len(launchers) == 1
          links = {path.name for path in launchers[0].iterdir() if path.is_symlink()}
          assert links == {"codex-linux-sandbox", "apply_patch", "applypatch"}
          assert all((launchers[0] / name).resolve(strict=True).is_file() for name in links)
          credentials = codex_home / "auth.json"
          credentials.write_text("credential-sentinel", encoding="utf-8")
          runner = object.__new__(CodexRunner)
          runner.codex_home = codex_home
          runner.gid = 10002
          runner.uid = 10002
          runner._prepare_codex_home()
          assert not arg0_root.exists()
          assert credentials.read_text(encoding="utf-8") == "credential-sentinel"
          # The real production entry point must run its version probe under
          # UID 10002, not leave root-owned launcher files for codex exec.
          os.environ["NOUS_CODEX_HOME"] = str(codex_home)
          probe = CodexRunner(workdir=Path("/tmp/codex-smoke"))
          assert probe.version == "0.166.0"
          assert (codex_home / "tmp" / "arg0-linux").is_dir()
          assert credentials.read_text(encoding="utf-8") == "credential-sentinel"
          assert "--skip-git-repo-check" in probe._codex_args(
              Path("/tmp/codex-smoke/stage"), Path("/app/reports/schemas/plan.schema.json"),
              Path("/tmp/codex-smoke/stage/output.json"))
          print("Production report Worker: Astro release, Codex unprivileged version and launcher smoke passed")
          '
      - name: Record immutable report Worker image reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          echo "ghcr.io/yohn-jp/nous-osint-reports@$IMAGE_DIGEST" | tee report-worker-image-ref.txt
          echo "Report Worker: ghcr.io/yohn-jp/nous-osint-reports@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report Worker deployment reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nous-report-worker-image-digest
          path: report-worker-image-ref.txt
          retention-days: 90


  terraform:
    needs: [changes, ci-contracts]
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare/terraform
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  frontend-deploy:
    environment: frontend-production
    needs: [changes, frontend]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true' &&
      needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: edge/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: edge/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: edge-release-${{ github.sha }}
          path: edge/frontend/.cloudflare/output/v0/
      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CLOUDFLARE_API_TOKEN is not configured; deployment cannot run' >&2
            exit 1
          fi
      - name: Release only the validated main SHA (preserve Terraform routes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cbde0d943a9f28b00cd34bb12ebd142d
          CLOUDFLARE_ZONE_ID: 012f11f9c2c929d034006f3ee682703b
          GITHUB_TOKEN: ${{ github.token }}
          FRONTEND_RELEASE_MODE: ${{ needs.frontend.outputs.release_mode }}
        run: node scripts/release.mjs

  ci:
    if: always()
    needs: [changes, ci-contracts, check, cve-role-grants, frontend, reports, image, report-worker-image, terraform, frontend-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected lanes to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['changes']['result'] == 'success'
          assert jobs['ci-contracts']['result'] == 'success'
          assert all(job['result'] in {'success', 'skipped'} for job in jobs.values()), jobs
          PY
