name: Probe a reviewed OSINT source
on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Registered source ID to probe (no database changes)"
        type: string
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Validate entire source registry
        run: python -m nous.onboard_source --check-registry
      - name: Probe requested source using production SSRF protections
        env:
          SOURCE_ID: ${{ inputs.source_id }}
        run: |
          python -m nous.onboard_source --probe-id "$SOURCE_ID" | tee -a "$GITHUB_STEP_SUMMARY"
