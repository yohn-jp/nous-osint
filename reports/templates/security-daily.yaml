id: security-daily
revision: 1
title: Daily security intelligence
category: security
parameters_schema:
  required: [target_date]
  optional: [timezone, category]
  category_values: [security, advisory, vulnerability]
source_selector:
  kinds: [news, advisory, vulnerability]
  allow_title_metadata: true
window_policy:
  type: local_day
  timezone_default: Asia/Tokyo
evidence_limits:
  max_records: 200
  max_per_source: 50
  max_sources: 50
  max_bundle_bytes: 2097152
  max_sources_in_article: 50
outline: [overview, material_changes, analysis, sources]
quality_rules:
  - Separate publisher observations from analysis and unknowns.
  - Do not claim exploitation from a title mention or stale catalog.
  - Do not reproduce source body text; use short metadata titles only.
publish_policy:
  minimum_evidence: 1
  minimum_supported_claims: 1
  allowed_blocks: [paragraph, bullet_list, fact_table, source_list, cve_fact, quote]
