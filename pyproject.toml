[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nous-osint"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["alembic==1.17.2", "fastapi==0.121.2", "feedparser==6.0.12", "httpx==0.28.1", "jsonschema==4.25.1", "psycopg[binary]==3.2.12", "pydantic==2.12.4", "PyYAML==6.0.3", "SQLAlchemy==2.0.44", "uvicorn==0.38.0", "beautifulsoup4==4.14.2", "cryptography==46.0.3", "mcp==2.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.1", "ruff==0.14.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
